name: Nexa PIN Guard Test APK

on:
  push:
    branches:
      - main
      - fix/assets-pin-entry-guard-20261116
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract project
        run: |
          mkdir -p nexa
          unzip -q Nexa_Latest_GitHub_Ready.zip -d nexa
      - name: Apply and check PIN guard
        working-directory: nexa
        run: |
          python3 ../tools/patch_assets_pin_guard.py
          python3 ../tools/check_assets_pin_guard.py
      - name: Find Gradle project
        id: project
        run: |
          PROJECT_DIR=$(find nexa -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -1)
          test -n "$PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
      - name: Build separately installable test APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon assembleDebug -PnexaRegressionOnly
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-PIN-Guard-Test-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
