name: Build Nexa Latest APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check source signing security
        run: python3 tools/check_source_security.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Latest Nexa
        run: |
          rm -rf nexa
          mkdir nexa
          unzip -o Nexa_Latest_GitHub_Ready.zip -d nexa

      - name: Find Nexa project root
        id: project
        run: |
          PROJECT_DIR=$(find nexa -type f -name settings.gradle -printf '%h\n' | head -1)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find nexa -type f -name settings.gradle.kts -printf '%h\n' | head -1)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find settings.gradle or settings.gradle.kts"
            find nexa -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project root: $PROJECT_DIR"

      - name: Restore private signing key
        env:
          NEXA_KEYSTORE_BASE64: ${{ secrets.NEXA_KEYSTORE_BASE64 }}
          NEXA_STORE_PASSWORD: ${{ secrets.NEXA_STORE_PASSWORD }}
          NEXA_KEY_ALIAS: ${{ secrets.NEXA_KEY_ALIAS }}
          NEXA_KEY_PASSWORD: ${{ secrets.NEXA_KEY_PASSWORD }}
        run: |
          set -eu
          if [ -z "$NEXA_KEYSTORE_BASE64" ] || [ -z "$NEXA_STORE_PASSWORD" ] || [ -z "$NEXA_KEY_ALIAS" ] || [ -z "$NEXA_KEY_PASSWORD" ]; then
            echo "::error::Configure the four NEXA signing secrets before building an installable update."
            exit 1
          fi
          umask 077
          printf '%s' "$NEXA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexa-signing.jks"

      - name: Build Nexa
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          NEXA_KEYSTORE_PATH: ${{ runner.temp }}/nexa-signing.jks
          NEXA_STORE_PASSWORD: ${{ secrets.NEXA_STORE_PASSWORD }}
          NEXA_KEY_ALIAS: ${{ secrets.NEXA_KEY_ALIAS }}
          NEXA_KEY_PASSWORD: ${{ secrets.NEXA_KEY_PASSWORD }}
        run: gradle --no-daemon clean assembleDebug

      - name: Remove private signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/nexa-signing.jks"

      - name: Read app version
        id: version
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          VERSION=$(sed -n 's/.*versionName[[:space:]]*["'\'']\([^"'\'']*\)["'\''].*/\1/p' app/build.gradle | head -1)

          if [ -z "$VERSION" ] && [ -f app/build.gradle.kts ]; then
            VERSION=$(sed -n 's/.*versionName[[:space:]]*=[[:space:]]*["'\'']\([^"'\'']*\)["'\''].*/\1/p' app/build.gradle.kts | head -1)
          fi

          if [ -z "$VERSION" ]; then
            VERSION="unknown"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload Nexa APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-${{ steps.version.outputs.version }}-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
