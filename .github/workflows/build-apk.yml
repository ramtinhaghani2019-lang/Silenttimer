name: Build Nexa 5.2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Nexa source
        run: |
          rm -rf nexa_build
          mkdir nexa_build
          unzip -o Nexa_5.2_GitHub_Ready.zip -d nexa_build

      - name: Find project
        run: |
          find nexa_build -name settings.gradle -o -name settings.gradle.kts
          find nexa_build -maxdepth 3 -type f | head -100

      - name: Build APK
        run: |
          cd nexa_build

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew clean assembleDebug
          elif [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            gradle clean assembleDebug
          else
            PROJECT_DIR=$(find . -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs dirname)
            echo "Project found at: $PROJECT_DIR"
            cd "$PROJECT_DIR"

            if [ -f gradlew ]; then
              chmod +x gradlew
              ./gradlew clean assembleDebug
            else
              gradle clean assembleDebug
            fi
          fi

      -
