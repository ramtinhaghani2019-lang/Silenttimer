name: Build Nexa 5.2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract
        run: unzip -o Nexa_5.2_GitHub_Ready.zip -d nexa

      - name: Build
        run: |
          cd nexa
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-5.2-APK
          path: nexa/app/build/outputs/apk/debug/*.apk
