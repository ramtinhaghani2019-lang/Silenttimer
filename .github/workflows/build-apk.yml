name: Build Nexa Latest APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Latest Nexa
        run: |
          rm -rf nexa
          mkdir nexa
          unzip -o Nexa_Latest_GitHub_Ready.zip -d nexa

      - name: Build Nexa
        working-directory: nexa
        run: gradle --no-daemon clean assembleDebug

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s+"\K[^"]+' nexa/app/build.gradle | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload Nexa APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-${{ steps.version.outputs.version }}-APK
          path: nexa/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
