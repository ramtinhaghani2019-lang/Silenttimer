name: Build Nexa 5.3.5 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Nexa 5.3.5 FIXED2
        run: |
          rm -rf nexa
          mkdir nexa
          unzip -o Nexa_5.3.5_GitHub_Ready_FINAL_FIXED2.zip -d nexa

      - name: Build Nexa 5.3.5
        working-directory: nexa
        run: gradle --no-daemon clean assembleDebug

      - name: Upload Nexa 5.3.5 APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-5.3.5-APK
          path: nexa/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
