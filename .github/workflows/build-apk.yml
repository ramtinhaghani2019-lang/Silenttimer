name: Build Nexa 5.2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Nexa_5.2_GitHub_Ready.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract Nexa 5.2 source
        run: |
          rm -rf nexa_build
          mkdir -p nexa_build
          unzip -o Nexa_5.2_GitHub_Ready.zip -d nexa_build

      - name: Show extracted files
        run: |
          echo "=== Extracted content ==="
          find nexa_build -maxdepth 3 -type f | sort | head -200

      - name: Find Android project
        id: project
        shell: bash
        run
